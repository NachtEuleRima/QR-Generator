<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        input {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
        }
        #qrCanvas {
            margin-top: 20px;
        }
        #error {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>QR Code Generator</h1>
    <input type="text" id="qrInput" placeholder="Enter text or URL">
    <div id="qrCanvas"></div>
    <div id="error"></div>

    <script>
        // qrcode-generator by Kazuhiko Arase (unminified, with fixes)
        var qrcode = (function() {
            function QRCode(typeNumber, errorCorrectionLevel) {
                this.typeNumber = typeNumber;
                this.errorCorrectionLevel = errorCorrectionLevel;
                this.modules = null;
                this.moduleCount = 0;
                this.dataList = [];
                this.dataCache = null;
            }

            QRCode.prototype = {
                addData: function(data) {
                    this.dataList.push({ mode: "Byte", data: data });
                    this.dataCache = null;
                },
                isDark: function(row, col) {
                    if (this.modules == null) return false;
                    return this.modules[row][col];
                },
                getModuleCount: function() {
                    return this.moduleCount;
                },
                make: function() {
                    this.makeImpl(false, this.getBestMaskPattern());
                },
                makeImpl: function(test, maskPattern) {
                    this.moduleCount = this.typeNumber * 4 + 17;
                    this.modules = new Array(this.moduleCount);
                    for (var row = 0; row < this.moduleCount; row++) {
                        this.modules[row] = new Array(this.moduleCount);
                        for (var col = 0; col < this.moduleCount; col++) {
                            this.modules[row][col] = null;
                        }
                    }
                    this.setupPositionProbePattern(0, 0);
                    this.setupPositionProbePattern(this.moduleCount - 7, 0);
                    this.setupPositionProbePattern(0, this.moduleCount - 7);
                    this.setupPositionAdjustPattern();
                    this.setupTimingPattern();
                    this.setupTypeInfo(test, maskPattern);
                    if (this.typeNumber >= 7) {
                        this.setupTypeNumber(test);
                    }
                    if (this.dataCache == null) {
                        this.dataCache = this.createData(this.typeNumber, this.errorCorrectionLevel, this.dataList);
                    }
                    this.mapData(this.dataCache, maskPattern);
                },
                setupPositionProbePattern: function(row, col) {
                    for (var r = -1; r <= 7; r++) {
                        for (var c = -1; c <= 7; c++) {
                            if (row + r <= -1 || this.moduleCount <= row + r || col + c <= -1 || this.moduleCount <= col + c) continue;
                            if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                                this.modules[row + r][col + c] = true;
                            } else {
                                this.modules[row + r][col + c] = false;
                            }
                        }
                    }
                },
                setupTimingPattern: function() {
                    for (var i = 8; i < this.moduleCount - 8; i++) {
                        if (this.modules[i][6] == null) this.modules[i][6] = (i % 2 == 0);
                        if (this.modules[6][i] == null) this.modules[6][i] = (i % 2 == 0);
                    }
                },
                setupPositionAdjustPattern: function() {
                    var pos = this.getAlignmentPatternPositions();
                    for (var i = 0; i < pos.length; i++) {
                        for (var j = 0; j < pos.length; j++) {
                            var row = pos[i];
                            var col = pos[j];
                            if (this.modules[row][col] != null) continue;
                            for (var r = -2; r <= 2; r++) {
                                for (var c = -2; c <= 2; c++) {
                                    this.modules[row + r][col + c] = (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0));
                                }
                            }
                        }
                    }
                },
                setupTypeNumber: function(test) {
                    var bits = this.getBCHTypeNumber(this.typeNumber);
                    for (var i = 0; i < 18; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
                        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
                    }
                },
                setupTypeInfo: function(test, maskPattern) {
                    var data = (this.errorCorrectionLevel << 3) | maskPattern;
                    var bits = this.getBCHTypeInfo(data);
                    for (var i = 0; i < 15; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        if (i < 6) this.modules[i][8] = mod;
                        else if (i < 8) this.modules[i + 1][8] = mod;
                        else this.modules[this.moduleCount - 15 + i][8] = mod;
                        if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
                        else if (i < 9) this.modules[8][7 - (i - 8)] = mod;
                        else this.modules[8][15 - i] = mod;
                    }
                    this.modules[this.moduleCount - 8][8] = !test;
                },
                mapData: function(data, maskPattern) {
                    var inc = -1;
                    var row = this.moduleCount - 1;
                    var bitIndex = 7;
                    var byteIndex = 0;
                    var maskFunc = this.getMaskFunction(maskPattern);
                    for (var col = this.moduleCount - 1; col > 0; col -= 2) {
                        if (col == 6) col--;
                        while (true) {
                            for (var c = 0; c < 2; c++) {
                                if (this.modules[row][col - c] == null) {
                                    var dark = false;
                                    if (byteIndex < data.length) {
                                        dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                                    }
                                    if (maskFunc(row, col - c)) {
                                        dark = !dark;
                                    }
                                    this.modules[row][col - c] = dark;
                                    bitIndex--;
                                    if (bitIndex == -1) {
                                        byteIndex++;
                                        bitIndex = 7;
                                    }
                                }
                            }
                            row += inc;
                            if (row < 0 || this.moduleCount <= row) {
                                row -= inc;
                                inc = -inc;
                                break;
                            }
                        }
                    }
                },
                createData: function(typeNumber, errorCorrectionLevel, dataList) {
                    var rsBlocks = this.getRSBlocks(typeNumber, errorCorrectionLevel);
                    var buffer = new QRBitBuffer();
                    for (var i = 0; i < dataList.length; i++) {
                        var data = dataList[i];
                        buffer.put(4, 4); // Byte mode
                        buffer.put(data.data.length, 8);
                        for (var j = 0; j < data.data.length; j++) {
                            buffer.put(data.data.charCodeAt(j), 8);
                        }
                    }
                    var totalDataCount = 0;
                    for (var i = 0; i < rsBlocks.length; i++) {
                        totalDataCount += rsBlocks[i].dataCount;
                    }
                    if (buffer.getLengthInBits() > totalDataCount * 8) {
                        throw new Error("Input too long for this QR version");
                    }
                    // Ensure at least some data to avoid empty buffer issues
                    if (buffer.getLengthInBits() < 8) {
                        buffer.put(0, 8); // Pad with a null byte if too short
                    }
                    while (buffer.getLengthInBits() % 8 != 0) {
                        buffer.putBit(0);
                    }
                    while (buffer.getLengthInBits() < totalDataCount * 8) {
                        buffer.put(0xEC, 8);
                        if (buffer.getLengthInBits() < totalDataCount * 8) {
                            buffer.put(0x11, 8);
                        }
                    }
                    return this.createBytes(buffer, rsBlocks);
                },
                createBytes: function(buffer, rsBlocks) {
                    var offset = 0;
                    var maxDcCount = 0;
                    var maxEcCount = 0;
                    var dcdata = new Array(rsBlocks.length);
                    var ecdata = new Array(rsBlocks.length);
                    for (var r = 0; r < rsBlocks.length; r++) {
                        var dcCount = rsBlocks[r].dataCount;
                        var ecCount = rsBlocks[r].totalCount - dcCount;
                        maxDcCount = Math.max(maxDcCount, dcCount);
                        maxEcCount = Math.max(maxEcCount, ecCount);
                        dcdata[r] = new Array(dcCount);
                        for (var i = 0; i < dcCount; i++) {
                            dcdata[r][i] = 0xff & buffer.buffer[i + offset];
                        }
                        offset += dcCount;
                        var rsPoly = this.getErrorCorrectionPolynomial(ecCount);
                        var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
                        var modPoly = rawPoly.mod(rsPoly);
                        ecdata[r] = new Array(rsPoly.getLength() - 1);
                        for (var i = 0; i < ecdata[r].length; i++) {
                            var modIndex = i + modPoly.getLength() - ecdata[r].length;
                            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
                        }
                    }
                    var totalCodeCount = 0;
                    for (var i = 0; i < rsBlocks.length; i++) {
                        totalCodeCount += rsBlocks[i].totalCount;
                    }
                    var data = new Array(totalCodeCount);
                    var index = 0;
                    for (var i = 0; i < maxDcCount; i++) {
                        for (var r = 0; r < rsBlocks.length; r++) {
                            if (i < dcdata[r].length) {
                                data[index++] = dcdata[r][i];
                            }
                        }
                    }
                    for (var i = 0; i < maxEcCount; i++) {
                        for (var r = 0; r < rsBlocks.length; r++) {
                            if (i < ecdata[r].length) {
                                data[index++] = ecdata[r][i];
                            }
                        }
                    }
                    return data;
                },
                getBestMaskPattern: function() {
                    var minLostPoint = 0;
                    var pattern = 0;
                    for (var i = 0; i < 8; i++) {
                        this.makeImpl(true, i);
                        var lostPoint = this.getLostPoint();
                        if (i == 0 || minLostPoint > lostPoint) {
                            minLostPoint = lostPoint;
                            pattern = i;
                        }
                    }
                    return pattern;
                },
                getLostPoint: function() {
                    var moduleCount = this.moduleCount;
                    var lostPoint = 0;
                    for (var row = 0; row < moduleCount; row++) {
                        for (var col = 0; col < moduleCount; col++) {
                            var sameCount = 0;
                            var dark = this.isDark(row, col);
                            for (var r = -1; r <= 1; r++) {
                                if (row + r < 0 || moduleCount <= row + r) continue;
                                for (var c = -1; c <= 1; c++) {
                                    if (col + c < 0 || moduleCount <= col + c) continue;
                                    if (r == 0 && c == 0) continue;
                                    if (dark == this.isDark(row + r, col + c)) {
                                        sameCount++;
                                    }
                                }
                            }
                            if (sameCount > 5) {
                                lostPoint += (3 + sameCount - 5);
                            }
                        }
                    }
                    for (var row = 0; row < moduleCount - 1; row++) {
                        for (var col = 0; col < moduleCount - 1; col++) {
                            var count = 0;
                            if (this.isDark(row, col)) count++;
                            if (this.isDark(row + 1, col)) count++;
                            if (this.isDark(row, col + 1)) count++;
                            if (this.isDark(row + 1, col + 1)) count++;
                            if (count == 0 || count == 4) {
                                lostPoint += 3;
                            }
                        }
                    }
                    return lostPoint;
                },
                getAlignmentPatternPositions: function() {
                    if (this.typeNumber == 1) return [];
                    var count = Math.floor(this.typeNumber / 7) + 2;
                    var step = (this.typeNumber == 32) ? 26 : Math.ceil((this.moduleCount - 13) / (count - 1));
                    var pos = new Array(count);
                    pos[0] = 6;
                    for (var i = 1; i < count - 1; i++) {
                        pos[i] = pos[0] + i * step;
                    }
                    pos[count - 1] = this.moduleCount - 7;
                    return pos;
                },
                getMaskFunction: function(maskPattern) {
                    switch (maskPattern) {
                        case 0: return function(i, j) { return (i + j) % 2 == 0; };
                        case 1: return function(i, j) { return i % 2 == 0; };
                        case 2: return function(i, j) { return j % 3 == 0; };
                        case 3: return function(i, j) { return (i + j) % 3 == 0; };
                        case 4: return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0; };
                        case 5: return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
                        case 6: return function(i, j) { return ((i * j) % 2 + (i * j) % 3) % 2 == 0; };
                        case 7: return function(i, j) { return ((i * j) % 3 + (i + j) % 2) % 2 == 0; };
                    }
                },
                getErrorCorrectionPolynomial: function(errorCorrectionLength) {
                    var poly = new QRPolynomial([1], errorCorrectionLength);
                    for (var i = 0; i < errorCorrectionLength; i++) {
                        poly = poly.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
                    }
                    return poly;
                },
                getBCHTypeInfo: function(data) {
                    var d = data << 10;
                    while (QRMath.getBCHDigit(d) - QRMath.getBCHDigit(0x537) >= 0) {
                        d ^= (0x537 << (QRMath.getBCHDigit(d) - QRMath.getBCHDigit(0x537)));
                    }
                    return (data << 10) | d;
                },
                getBCHTypeNumber: function(data) {
                    var d = data << 12;
                    while (QRMath.getBCHDigit(d) - QRMath.getBCHDigit(0x1F25) >= 0) {
                        d ^= (0x1F25 << (QRMath.getBCHDigit(d) - QRMath.getBCHDigit(0x1F25)));
                    }
                    return (data << 12) | d;
                },
                getRSBlocks: function(typeNumber, errorCorrectionLevel) {
                    var rsBlock = this.getRsBlockTable(typeNumber, errorCorrectionLevel);
                    var length = rsBlock.length / 3;
                    var list = [];
                    for (var i = 0; i < length; i++) {
                        var count = rsBlock[i * 3 + 0];
                        var totalCount = rsBlock[i * 3 + 1];
                        var dataCount = rsBlock[i * 3 + 2];
                        for (var j = 0; j < count; j++) {
                            list.push({ totalCount: totalCount, dataCount: dataCount });
                        }
                    }
                    return list;
                },
                getRsBlockTable: function(typeNumber, errorCorrectionLevel) {
                    switch (errorCorrectionLevel) {
                        case 1: return QRRSBlockTable[(typeNumber - 1) * 4 + 0];
                        case 0: return QRRSBlockTable[(typeNumber - 1) * 4 + 1];
                        case 3: return QRRSBlockTable[(typeNumber - 1) * 4 + 2];
                        case 2: return QRRSBlockTable[(typeNumber - 1) * 4 + 3];
                    }
                }
            };

            var QRRSBlockTable = [
                [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
                [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
                [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
                [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
                [1, 134, 108], [2, 67, 43], [2, 33, 15, 2, 34, 16], [2, 33, 11, 2, 34, 12]
            ];

            function QRBitBuffer() {
                this.buffer = [];
                this.length = 0;
            }

            QRBitBuffer.prototype = {
                get: function(index) {
                    var bufIndex = Math.floor(index / 8);
                    return ((this.buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
                },
                put: function(num, length) {
                    for (var i = 0; i < length; i++) {
                        this.putBit(((num >>> (length - i - 1)) & 1) == 1);
                    }
                },
                getLengthInBits: function() {
                    return this.length;
                },
                putBit: function(bit) {
                    var bufIndex = Math.floor(this.length / 8);
                    if (this.buffer.length <= bufIndex) {
                        this.buffer.push(0);
                    }
                    if (bit) {
                        this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
                    }
                    this.length++;
                }
            };

            function QRPolynomial(num, shift) {
                if (num.length == undefined) throw new Error(num.length + "/" + shift);
                var offset = 0;
                while (offset < num.length && num[offset] == 0) offset++;
                this.num = new Array(num.length - offset + shift);
                for (var i = 0; i < num.length - offset; i++) {
                    this.num[i] = num[i + offset];
                }
            }

            QRPolynomial.prototype = {
                get: function(index) {
                    return this.num[index] || 0;
                },
                getLength: function() {
                    return this.num.length;
                },
                multiply: function(e) {
                    var num = new Array(this.getLength() + e.getLength() - 1);
                    for (var i = 0; i < this.getLength(); i++) {
                        for (var j = 0; j < e.getLength(); j++) {
                            var a = this.get(i), b = e.get(j);
                            if (a !== 0 && b !== 0) { // Avoid glog(0)
                                num[i + j] ^= QRMath.gexp(QRMath.glog(a) + QRMath.glog(b));
                            }
                        }
                    }
                    return new QRPolynomial(num, 0);
                },
                mod: function(e) {
                    if (this.getLength() - e.getLength() < 0) return this;
                    var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
                    var num = new Array(this.getLength());
                    for (var i = 0; i < this.getLength(); i++) {
                        num[i] = this.get(i);
                    }
                    for (var i = 0; i < e.getLength(); i++) {
                        var eVal = e.get(i);
                        if (eVal !== 0) { // Avoid glog(0)
                            num[i] ^= QRMath.gexp(QRMath.glog(eVal) + ratio);
                        }
                    }
                    return new QRPolynomial(num, 0).mod(e);
                }
            };

            var QRMath = {
                glog: function(n) {
                    if (n < 1) throw new Error("glog(" + n + ")");
                    return QRMath.LOG_TABLE[n];
                },
                gexp: function(n) {
                    while (n < 0) n += 255;
                    while (n >= 256) n -= 255;
                    return QRMath.EXP_TABLE[n];
                },
                EXP_TABLE: new Array(256),
                LOG_TABLE: new Array(256)
            };

            (function() {
                for (var i = 0; i < 8; i++) {
                    QRMath.EXP_TABLE[i] = 1 << i;
                }
                for (var i = 8; i < 256; i++) {
                    QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
                }
                for (var i = 0; i < 255; i++) {
                    QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;
                }
            })();

            QRMath.getBCHDigit = function(data) {
                var digit = 0;
                while (data != 0) {
                    digit++;
                    data >>>= 1;
                }
                return digit;
            };

            return {
                create: function(typeNumber, errorCorrectionLevel) {
                    return new QRCode(typeNumber, errorCorrectionLevel);
                }
            };
        })();

        // App logic
        function drawQRCode(text) {
            try {
                var qr = qrcode.create(4, 0); // Version 4, Medium error correction
                qr.addData(text);
                qr.make();

                var canvas = document.createElement('canvas');
                var size = qr.getModuleCount();
                var scale = 6;
                canvas.width = size * scale;
                canvas.height = size * scale;
                var ctx = canvas.getContext('2d');

                ctx.fillStyle = '#FFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#000';

                for (var row = 0; row < size; row++) {
                    for (var col = 0; col < size; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(col * scale, row * scale, scale, scale);
                        }
                    }
                }
                return canvas;
            } catch (e) {
                throw e;
            }
        }

        const qrInput = document.getElementById('qrInput');
        const qrCanvas = document.getElementById('qrCanvas');
        const errorDiv = document.getElementById('error');

        qrInput.addEventListener('input', function() {
            qrCanvas.innerHTML = '';
            errorDiv.style.display = 'none';
            if (qrInput.value.trim()) {
                try {
                    var canvas = drawQRCode(qrInput.value);
                    qrCanvas.appendChild(canvas);
                } catch (e) {
                    console.error('QR Code Error:', e);
                    errorDiv.textContent = 'Error: ' + e.message;
                    errorDiv.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
